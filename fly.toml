# fly.toml app configuration file generated for thesuite-backend on 2026-11-18T14:49:14Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'thesuite-backend'
primary_region = 'ams'
console_command = '/code/manage.py shell'

[build]
[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'

[processes]
  app = 'gunicorn --bind :8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker config.asgi'
  celery = 'celery -A config worker --loglevel=INFO'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
